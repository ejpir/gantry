version: "2"

# golangci-lint configuration for gantry.
#
# Linter set: the golangci-lint standard default (errcheck, govet,
# ineffassign, staticcheck, unused). The historical backlog was cleared
# in three sweeps (platform gating, dead code/staticcheck, errcheck);
# CI now enforces the FULL tree on every change, so nothing can regress.
#
# Platform awareness: there is no single "the code". Per-OS/arch build
# tags select different files, and findings differ per platform —
# errcheck on syscall wrappers, helpers only referenced from another
# platform's file, and so on. CI therefore runs the linter once per
# supported target by setting GOOS/GOARCH:
#
#   linux/amd64, linux/arm64, darwin/arm64, windows/amd64
#
# Local usage:
#   golangci-lint run ./...
#   GOOS=windows GOARCH=arm64 golangci-lint run ./...

run:
  timeout: 5m

# No issue-count caps: the defaults (50 per linter, 3 identical) silently
# truncate output, which hides backlog both locally and in CI.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  exclusions:
    generated: lax # generated files (api/**/*.pb.go) carry the DO NOT EDIT marker
    # No exclusion presets: the std-error-handling preset would hide
    # unchecked Close/Fprintf/Remove returns — exactly the sloppy error
    # handling a sandbox should be deliberate about. Everything the
    # standard linters report must be fixed or explicitly discarded.
    presets: []
    paths:
      # Vendored fork with its own module; lint it upstream, not here.
      - third_party/
