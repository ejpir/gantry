openapi: 3.1.0
info:
  title: Gantry Local Manager API
  version: 1.0.0
  description: >-
    Same-user local sandbox lifecycle API. The default endpoint is an
    HTTP/1.1 Unix-domain socket; it is not a network authentication boundary.
    `gantry serve` may additionally opt into a TLS listener
    (`-listen tls://ADDR:PORT --token-file PATH`), on which every request —
    including /v1/health and this document — requires a valid bearer token.
servers:
  - url: http://gantry.local
paths:
  /v1/health:
    get:
      operationId: health
      responses:
        "200":
          description: Manager health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/openapi.yaml:
    get:
      operationId: openAPI
      responses:
        "200":
          description: This OpenAPI contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/policy-feed/enrollment:
    get:
      operationId: getPolicyFeedEnrollment
      description: Reports staging or configuration, never private identity material.
      responses:
        "200":
          description: Feed enrollment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedStatus" }
    post:
      operationId: preparePolicyFeedEnrollment
      description: Creates a private host key and returns only its CSR. Matching retries reuse the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyFeedPrepareRequest" }
      responses:
        "201":
          description: Host CSR, with key retained on this manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedPrepareResponse" }
        "200":
          description: Existing matching host CSR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedPrepareResponse" }
  /v1/policy-feed/enrollment/install:
    post:
      operationId: installPolicyFeedEnrollment
      description: Pins the returned public files to the prepared CSR and stages a feed for explicit activation or restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyFeedInstallRequest" }
      responses:
        "200":
          description: Staged, not yet enforced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedStatus" }
  /v1/policy-feed/enrollment/activate:
    post:
      operationId: activatePolicyFeedEnrollment
      description: Applies an available signed generation before attaching the receiver without restarting. Fails if no generation is available; partial fan-out remains governed and retries.
      responses:
        "200":
          description: Live receiver with a generation applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedStatus" }
        "202":
          description: A verified generation is pending on failed targets; retrying fail closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyFeedStatus" }
  /v1/sandboxes:
    get:
      operationId: listSandboxes
      responses:
        "200":
          description: Current local sandboxes
          content:
            application/json:
              schema:
                type: object
                required: [sandboxes]
                properties:
                  sandboxes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sandbox"
    post:
      operationId: createSandbox
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Sandbox is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "200":
          description: Replayed completed idempotent operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "202":
          description: Matching idempotent operation is still running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /v1/run:
    post:
      operationId: runVM
      description: >-
        Run the existing low-level kernel/disk launcher in a helper on the
        manager host, not a named sandbox. Console I/O is bounded. The helper
        is killed and reaped on deadline, caller disconnect or manager shutdown.
        Uses bounded lifecycle admission; raw runs are serialized and refused
        while an organization-wide feed policy is active. Repeat an
        Idempotency-Key to retrieve the same operation, never launch twice.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunVMRequest" }
      responses:
        "200":
          description: Completed operation with run console/exit result (124 deadline, 130 cancellation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "202":
          description: Matching idempotent run is still active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          $ref: "#/components/responses/Error"
        "408":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    patch:
      operationId: configureSandbox
      description: >-
        Partial update through the existing live/stopped configuration path.
        Omitted settings are preserved; explicit false disables a feature.
        Resource and Dev Containers topology changes require restart when
        running. Stopped changes take the launch lock. Result is in configure.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigureSandboxRequest" }
      responses:
        "200":
          description: Configuration committed, including idempotent replays
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "202":
          description: Matching update is still in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      operationId: getSandbox
      responses:
        "200":
          description: Sandbox state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSandbox
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Sandbox deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /v1/sandboxes/{name}/start:
    post:
      operationId: startSandbox
      parameters:
        - $ref: "#/components/parameters/SandboxName"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Saved sandbox is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /v1/sandboxes/{name}/stop:
    post:
      operationId: stopSandbox
      parameters:
        - $ref: "#/components/parameters/SandboxName"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Sandbox stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
  /v1/sandboxes/{name}/exec:
    post:
      operationId: execSandbox
      parameters:
        - $ref: "#/components/parameters/SandboxName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Process completed (including a non-zero process exit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "408":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
  /v1/operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}/net-policy:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    get:
      operationId: getNetworkPolicy
      responses:
        "200":
          description: Effective live or saved network policy, including organization constraints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPolicy" }
        "409":
          $ref: "#/components/responses/Error"
    put:
      operationId: setNetworkPolicy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPolicyRequest" }
      responses:
        "200":
          description: Policy validated, persisted and applied live when running; organization constraints remain in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}/policy:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    get:
      operationId: getOrganizationPolicy
      responses:
        "200":
          description: Organization policy provenance only, never sandbox credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPolicy" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: setOrganizationPolicy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationPolicyRequest" }
      responses:
        "200":
          description: Signed snapshot verified server-side and applied live when running; restart=true selects controlled stop/update/resume; mutation is refused while an organization-wide feed policy is active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{name}/audit:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    get:
      operationId: getAuditTail
      responses:
        "200":
          description: Bounded broker audit tail, falling back to persisted audit.log when stopped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditTail" }
        "404":
          $ref: "#/components/responses/Error"
  /v1/dashboard:
    get:
      operationId: dashboardSnapshot
      description: Full non-secret dashboard inventory and host form limits for source-scoped remote TUI parity.
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSnapshot" }
        "501":
          $ref: "#/components/responses/Error"
  /v1/dashboard/actions:
    post:
      operationId: dashboardAction
      description: Validated dashboard configuration mutation. The action discriminator selects one typed payload; secret values are write-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardActionRequest" }
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardActionResult" }
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/dashboard/packets/{name}:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    post:
      operationId: captureDashboardPackets
      description: Read or clear the named sandbox's bounded in-memory packet recorder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PacketCaptureRequest" }
      responses:
        "200":
          description: Bounded packet snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PacketCaptureSnapshot" }
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/ssh/hostkey:
    get:
      operationId: getSSHHostKey
      responses:
        "200":
          description: Install SSH public key (authenticated TLS is the initial trust channel)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHostKey" }
  /v1/sandboxes/{name}/ssh:
    parameters:
      - $ref: "#/components/parameters/SandboxName"
    post:
      operationId: sshTunnel
      description: Bodyless HTTP/1.1 request with Connection Upgrade and Upgrade gantry-ssh. After 101, bytes splice only to the named sandbox's SSH gateway. Session limits apply.
      responses:
        "101":
          description: Switching to the bidirectional SSH byte stream
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Sandbox stopped or SSH disabled; refused before upgrade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/Error"
  /v1/images:
    get:
      operationId: listImages
      responses:
        "200":
          description: Cached images on the manager host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageList" }
  /v1/images/pull:
    post:
      operationId: pullImage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePullRequest"
      responses:
        "202":
          description: Pull running; poll /v1/operations/{id} for progress and completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/Error"
  /v1/images/delete:
    post:
      operationId: deleteImage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageDeleteRequest"
      responses:
        "200":
          description: Image removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: events
      responses:
        "200":
          description: Bounded live lifecycle stream; historical events are not replayed
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Required on every request when the manager serves a tls:// listener.
        Tokens are provisioned out of band in the --token-file; authentication
        failures are an indistinguishable 403 and are audited by token
        fingerprint, never by value.
  parameters:
    SandboxName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,64}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }
        capabilities:
          type: array
          description: Additive features; dashboard-control-v1 includes strict action payloads and stale ordinal-rule checks.
          items: { type: string }
    PolicyFeedPrepareRequest:
      type: object
      required: [host, organization, profile, url, publicKeyFingerprint, caFingerprint]
      properties:
        host: { type: string }
        organization: { type: string }
        profile: { type: string }
        url: { type: string }
        publicKeyFingerprint: { type: string }
        caFingerprint: { type: string }
    PolicyFeedPrepareResponse:
      type: object
      required: [id, csr]
      properties:
        id: { type: string }
        csr: { type: string }
    PolicyFeedInstallRequest:
      type: object
      required: [id, files]
      properties:
        id: { type: string }
        files:
          type: object
          additionalProperties: { type: string }
    PolicyFeedStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [none, awaiting-enrollment, restart-required, activating, configured] }
        host: { type: string }
        organization: { type: string }
        profile: { type: string }
        configPath: { type: string }
        appliedGeneration: { type: integer, format: uint64 }
    DashboardSnapshot:
      $ref: "#/components/schemas/WireHostSnapshot"
    DashboardActionRequest:
      $ref: "#/components/schemas/WireActionRequest"
    DashboardActionResult:
      $ref: "#/components/schemas/WireActionResult"
    PacketCaptureRequest:
      $ref: "#/components/schemas/WirePacketRequest"
    PacketCaptureSnapshot:
      $ref: "#/components/schemas/WirePacketSnapshot"
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        operationId: { type: string }
    Sandbox:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { type: string, enum: [starting, running, stopped] }
        pid: { type: integer }
        image: { type: string }
        imageRef: { type: string }
        imageDigest: { type: string }
        cpus: { type: integer }
        memoryMiB: { type: integer }
        writable: { type: boolean }
        proxy: { type: string, format: uri }
        noProxy: { type: string }
        proxyEnforce: { type: boolean }
        desired:
          $ref: "#/components/schemas/BootSettings"
        active:
          description: Settings allocated to the running VM; absent for stopped sandboxes and daemons started by older versions.
          $ref: "#/components/schemas/BootSettings"
        restartRequired: { type: boolean }
    BootSettings:
      type: object
      required: [memoryMiB, cpus, processIsolation, devContainers]
      properties:
        memoryMiB: { type: integer }
        cpus: { type: integer }
        processIsolation: { type: string, enum: [auto, required, off] }
        devContainers: { type: boolean }
    CreateSandboxRequest:
      type: object
      required: [name, image]
      properties:
        organizationPolicy:
          $ref: "#/components/schemas/OrganizationSnapshot"
          description: Optional signed organization policy, verified before boot. Not a transferable organization login credential. An active manager-wide feed snapshot is inherited and conflicting input is refused.
        name: { type: string }
        image: { type: string }
        kernel: { type: string }
        rootfs: { type: string }
        runtime: { type: string, enum: [crun, runsc] }
        rw: { type: boolean, default: false }
        rwlayer: { type: string }
        shares:
          type: array
          items: { type: string }
        publish:
          type: array
          items: { type: string }
        net: { type: boolean, default: true }
        networkPolicy: { type: string }
        allowLocalNetwork: { type: boolean, default: false }
        proxy: { type: string, format: uri }
        noProxy: { type: string }
        proxyEnforce: { type: boolean, default: false }
        ssh: { type: boolean, default: false }
        devContainers: { type: boolean, default: false }
        oauthBridge: { type: boolean, default: true }
        processIsolation: { type: string, enum: [auto, required, off], default: auto }
        memoryMiB: { type: integer, default: 512 }
        diskSizeMiB: { type: integer, minimum: 512, maximum: 65536, default: 512 }
        cpus: { type: integer, default: 1 }
        secretNames:
          description: Names resolved from the manager's startup environment; values are never accepted over HTTP or persisted.
          type: array
          items: { type: string }
    ConfigureSandboxRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ssh: { type: boolean }
        devContainers: { type: boolean }
        memoryMiB: { type: integer, minimum: 1 }
        cpus: { type: integer, minimum: 1 }
        processIsolation: { type: string, enum: [auto, required, off] }
    ConfigureSandboxResult:
      type: object
      required: [restartRequired]
      properties:
        restartRequired: { type: boolean }
    RunVMRequest:
      type: object
      additionalProperties: false
      required: [kernel]
      anyOf:
        - required: [initrd]
        - required: [rootfs]
      description: Explicit raw boot assets on the manager host. Not an arbitrary argv/shell endpoint. Strings except stdin are limited to 4096 bytes and may not contain NUL.
      properties:
        kernel: { type: string, minLength: 1, maxLength: 4096 }
        initrd: { type: string, maxLength: 4096 }
        rootfs: { type: string, maxLength: 4096 }
        disks:
          type: array
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 4096 }
        shares:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 4096 }
        networkEndpoint: { type: string, maxLength: 4096 }
        networkMAC: { type: string, default: "5a:94:ef:e4:0c:ee" }
        networkVFKIT: { type: boolean, default: true }
        networkDHCP: { type: boolean, default: true }
        vsockForward: { type: string, maxLength: 4096 }
        vsockListen: { type: string, default: "1026", description: Comma-separated uint32 guest ports; an explicit empty string disables listening }
        guestCID: { type: integer, default: 3 }
        memoryMiB: { type: integer, minimum: 1, default: 512 }
        cpus: { type: integer, minimum: 1, default: 1 }
        commandLine: { type: string, maxLength: 4096 }
        stdin: { type: string, maxLength: 65536 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 3600, default: 300 }
        maxOutputBytes: { type: integer, minimum: 1, maximum: 65536, default: 16384 }
    NetworkPolicy:
      type: object
      required: [allow_local, description, state]
      properties:
        path: { type: string }
        allow_local: { type: boolean }
        description: { type: string }
        state: { type: string, enum: [active, saved] }
        rules:
          type: array
          items: { $ref: "#/components/schemas/NetworkRuleSummary" }
    NetworkRuleSummary:
      type: object
      properties:
        action: { type: string }
        target: { type: string }
        protocol: { type: string }
        ports: { type: string }
        source: { type: string }
    NetworkPolicyRequest:
      type: object
      description: Exactly one of policy (JSON document) or default=true. Documents resolve on the server and cannot relax organization constraints.
      properties:
        policy: { type: object }
        default: { type: boolean }
        allowLocal: { type: boolean }
    OrganizationPolicyRequest:
      type: object
      description: Exactly one of snapshot or clear=true. Running sandboxes update live unless restart=true requests controlled stop/update/resume.
      properties:
        snapshot: { $ref: "#/components/schemas/OrganizationSnapshot" }
        clear: { type: boolean }
        restart: { type: boolean, description: Explicitly stop, update coherently, and resume instead of applying live }
    OrganizationSnapshot:
      type: object
      required: [bundle, public_key, profile]
      properties:
        bundle: { type: string, contentEncoding: base64, maxLength: 349528, description: Signed data-only OPA bundle; at most 256 KiB decoded }
        public_key: { type: string, maxLength: 16384, description: RSA PUBLIC key PEM, never a signing key }
        profile: { type: string }
    OrganizationPolicy:
      type: object
      required: [managed]
      properties:
        managed: { type: boolean }
        info: { $ref: "#/components/schemas/OrganizationInfo" }
    OrganizationInfo:
      type: object
      required: [organization, revision, profile, expires_at]
      properties:
        organization: { type: string }
        revision: { type: string }
        profile: { type: string }
        expires_at: { type: string, format: date-time }
    AuditTail:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items: { type: string }
    SSHHostKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: { type: string, description: OpenSSH authorized-key formatted public key }
    ImageList:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
    Image:
      type: object
      required: [ref, digest, arch, size, created]
      properties:
        ref: { type: string }
        digest: { type: string }
        arch: { type: string }
        size: { type: integer }
