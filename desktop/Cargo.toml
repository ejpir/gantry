[package]
name = "gantry-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Native, read-only desktop client for the Gantry manager"

[features]
default = ["ui"]
ui = ["dep:gpui-kit"]
ui-tests = ["ui", "gpui-kit/test-support"]

[[bin]]
name = "gantry-desktop"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"

[profile.dev]
debug = "limited"

[profile.test]
debug = "limited"
