[package]
name = "gantry-desktop"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Native, read-only desktop client for the Gantry manager"

[features]
default = ["ui"]
ui = ["dep:gpui-kit", "dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
ui-tests = ["ui", "gpui-kit/test-support"]

[[bin]]
name = "gantry-desktop"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.6.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The app icon (src/app_icon.rs): AppKit for the macOS Dock, PNG decoding for
# the X11 window icon. Windows embeds it at build time (build.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
tempfile = "3"

[profile.dev]
debug = "limited"

# GPUI, its renderer, and path tessellation are unusably slow unoptimized.
# Optimize every dependency in dev/test builds; this crate stays at opt-level 0
# so it remains debuggable. The first build after this change is slower.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = "limited"
