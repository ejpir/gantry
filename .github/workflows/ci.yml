name: CI

# Keep CI focused on executable/build inputs. Documentation-only changes do
# not consume runners; version tags still run the release job.
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'config/**'
      - 'guest/**'
      - 'integrations/**/*.js'
      - 'integrations/**/*.sh'
      - 'integrations/**/*.ts'
      - 'integrations/**/Dockerfile'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'config/**'
      - 'guest/**'
      - 'integrations/**/*.js'
      - 'integrations/**/*.sh'
      - 'integrations/**/*.ts'
      - 'integrations/**/Dockerfile'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Linux guest pieces used by the native exec smoke tests. The
  # host binaries are this repository's artifacts; the guest rootfs is the
  # compatible nerdbox asset (vminitd + crun). The kernel is Gantry's own
  # hardened build from the kernels job below.
  guest-assets:
    name: guest-assets/${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, docker_arch: amd64, kernel_arch: x86_64, page_size: 4k }
          - { name: arm64, docker_arch: arm64, kernel_arch: arm64, page_size: 16k }
    steps:
      - uses: actions/checkout@v4
      - name: cache guest assets
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundle
          key: guest-assets-v0.2.1-${{ matrix.name }}-${{ hashFiles('scripts/mkimage.sh', 'scripts/mkrootfs-gvisor.sh', 'guest/crunshim/**', '.github/workflows/ci.yml') }}
      - uses: docker/setup-buildx-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true'
      - name: install EROFS tools
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y erofs-utils
      - name: fetch guest source
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v0.2.1 https://github.com/containerd/nerdbox.git "$RUNNER_TEMP/nerdbox"
      - name: build guest rootfs
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/guest/rootfs" "$RUNNER_TEMP/bundle"
          docker buildx build --progress=plain \
            --file "$RUNNER_TEMP/nerdbox/Dockerfile" \
            --platform "linux/${{ matrix.docker_arch }}" \
            --target erofs \
            --build-arg KERNEL_ARCH=${{ matrix.kernel_arch }} \
            --build-arg KERNEL_PAGE_SIZE=${{ matrix.page_size }} \
            --build-arg KERNEL_NPROC=2 \
            --output "type=local,dest=$RUNNER_TEMP/guest/rootfs" \
            "$RUNNER_TEMP/nerdbox"
          cp "$RUNNER_TEMP/guest/rootfs/nerdbox-rootfs.erofs" \
            "$RUNNER_TEMP/bundle/nerdbox-rootfs.erofs"
      - name: build gVisor rootfs variant
        if: steps.guest-cache.outputs.cache-hit != 'true'
        # Produces bundle/nerdbox-rootfs-gvisor.erofs: /sbin/crun replaced by
        # runsc (released as nerdbox-rootfs-gvisor-<arch>.erofs, which the CLI
        # auto-downloads on first -runtime runsc start).
        run: ./scripts/mkrootfs-gvisor.sh "$RUNNER_TEMP/bundle/nerdbox-rootfs.erofs" "${{ matrix.kernel_arch }}"
      - name: build test image
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/mkimage.sh alpine:3.22 "$RUNNER_TEMP/bundle/alpine.erofs" "linux/${{ matrix.docker_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-assets-${{ matrix.name }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

  # Gantry's own hardened guest kernels (scripts/mkkernel.sh). These are
  # what the CLI downloads from the release page on first start, and what
  # the native smoke test boots. arm64 builds both the 16K default and the
  # 4K runsc twin; x86_64 is 4K-only. The build tree cache makes pushes
  # that don't touch kernel inputs incremental.
  # Keep /tmp/linux-VERSION paths in sync with VERSION in scripts/mkkernel.sh.
  kernels:
    name: kernel/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: ubuntu-24.04-arm }
          - { arch: x86_64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y flex bison bc xz-utils python3 libelf-dev libssl-dev
      - name: cache kernel tree
        uses: actions/cache@v4
        with:
          path: |
            /tmp/linux-7.0.12.tar.xz
            /tmp/linux-7.0.12-build-${{ matrix.arch }}
          key: kernel-7.0.12-${{ matrix.arch }}-${{ hashFiles('config/gantry-kernel-*.config', 'scripts/mkkernel.sh', 'scripts/kernel-hardening.sh') }}
      - name: build kernels
        shell: bash
        run: |
          set -eu
          export GANTRY_ARTIFACTS="$RUNNER_TEMP/kernels"
          ./scripts/mkkernel.sh ${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = arm64 ]; then
            PAGES=4k ./scripts/mkkernel.sh arm64
          fi
          ls -lh "$RUNNER_TEMP/kernels"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-kernel-${{ matrix.arch }}
          path: ${{ runner.temp }}/kernels/
          if-no-files-found: error

  test:
    name: test/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, quality: true, race: true }
          - { name: windows-arm64, os: windows-11-arm, quality: false, race: false }
          - { name: macos, os: macos-latest, quality: false, race: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: gofmt
        if: matrix.quality
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v third_party))
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        if: matrix.quality
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go test -race
        if: matrix.race
        run: go test -race -count=1 ./...

  native-smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: native-smoke/${{ matrix.name }}
    needs: [build, guest-assets, kernels]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, artifact: gantry-linux-amd64, binary: gantry-linux-amd64, guest: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/gantry-artifact
      - uses: actions/download-artifact@v4
        with:
          name: guest-assets-${{ matrix.guest }}
          path: ${{ runner.temp }}/guest-assets
      - uses: actions/download-artifact@v4
        with:
          name: gantry-kernel-x86_64
          path: ${{ runner.temp }}/kernels
      - name: make binary executable
        run: chmod +x "${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: start and exec smoke test
        shell: bash
        run: |
          set -eu
          BIN="${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
          ASSETS="${{ runner.temp }}/guest-assets"
          export GANTRY_HOME="$RUNNER_TEMP/gantry-home"
          cleanup() {
            status=$?
            "$BIN" stop ci >/dev/null 2>&1 || true
            if [ "$status" -eq 0 ]; then
              "$BIN" delete ci >/dev/null 2>&1 || true
            else
              for log in "$GANTRY_HOME/ci/daemon.log" "$GANTRY_HOME/ci/console.log"; do
                if [ -f "$log" ]; then
                  echo "---- $log ----"
                  tail -c 8192 "$log" || true
                  echo "----"
                fi
              done
            fi
            return "$status"
          }
          trap cleanup EXIT
          "$BIN" start ci \
            -kernel "${{ runner.temp }}/kernels/gantry-kernel-x86_64" \
            -rootfs "$ASSETS/nerdbox-rootfs.erofs" \
            -image "$ASSETS/alpine.erofs" \
            -net=false -rw=false
          if output=$("$BIN" exec ci -- /bin/sh -c 'echo hello world' 2>&1); then
            exec_rc=0
          else
            exec_rc=$?
          fi
          printf '%s\n' "$output"
          if [ "$exec_rc" -ne 0 ]; then
            echo "gantry exec failed with status $exec_rc" >&2
            exit "$exec_rc"
          fi
          printf '%s\n' "$output" | tr -d '\r' | grep -Fqx 'hello world'
      - name: upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.name }}-logs
          path: ${{ runner.temp }}/gantry-home/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: build packages
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag names become shell input below; only strict semver-ish
          # release tags are allowed anywhere near the build. Anything
          # else (spaces, quotes, $(), backticks) fails the job.
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
      - name: build binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # Version stamping only ever happens for tags (the release job
          # gates on refs/tags/v), so REF_NAME is validated by the step
          # above; on branches it stamps the harmless literal "dev".
          version="dev"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            version="$REF_NAME"
          fi
          go build -trimpath -ldflags "-X gantry/internal/vmm.Version=${version}" \
            -o "$RUNNER_TEMP/dist/gantry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/gantry
          go build -trimpath -o "$RUNNER_TEMP/dist/hostctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/hostctl
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  release:
    name: release/${{ github.ref_name }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, kernels, guest-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # artifact attestations (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gantry-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: guest-assets-*
          path: ${{ runner.temp }}/guest
      - name: stage guest rootfs assets
        run: |
          cp "${{ runner.temp }}/guest/guest-assets-arm64/nerdbox-rootfs.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/nerdbox-rootfs.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-x86_64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-arm64/nerdbox-rootfs-gvisor.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-gvisor-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/nerdbox-rootfs-gvisor.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-gvisor-x86_64.erofs"
      - name: checksum sidecars
        run: |
          cd "${{ runner.temp }}/release"
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
      - name: attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Strict tag check again: the tag is shell input below.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
          # No --clobber: assets are immutable once published. A name
          # collision fails the job loudly instead of silently replacing
          # artifacts (and their checksums) that users may already hold.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release/* --repo "$REPO"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release/* \
              --repo "$REPO" --title "$TAG" --generate-notes
          fi
          ls -lh "$RUNNER_TEMP"/release
