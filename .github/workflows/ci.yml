name: CI

# Keep CI focused on executable/build inputs. Documentation-only changes do
# not consume runners; version tags still run the release job.
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'config/**'
      - 'guest/**'
      - 'patches/**'
      - 'api/**'
      - 'integrations/**/*.js'
      - 'integrations/**/*.sh'
      - 'integrations/**/*.ts'
      - 'integrations/**/Dockerfile'
      - 'scripts/**'
      - '.golangci.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/fuzz.yml'
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/go.mod'
      - '**/go.sum'
      - 'config/**'
      - 'guest/**'
      - 'patches/**'
      - 'api/**'
      - 'integrations/**/*.js'
      - 'integrations/**/*.sh'
      - 'integrations/**/*.ts'
      - 'integrations/**/Dockerfile'
      - 'scripts/**'
      - '.golangci.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Linux guest pieces used by the native exec smoke tests. The
  # host binaries are this repository's artifacts; the guest rootfs is the
  # compatible nerdbox asset (vminitd + crun). The kernel is Gantry's own
  # hardened build from the kernels job below.
  guest-assets:
    name: guest-assets/${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, docker_arch: amd64, kernel_arch: x86_64 }
          - { name: arm64, docker_arch: arm64, kernel_arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: cache guest assets
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundle
          key: guest-assets-v0.2.4-${{ matrix.name }}-${{ hashFiles('scripts/mkrootfs.sh', 'patches/nerdbox-v0.2.4-*.patch', 'scripts/mkimage.sh', 'scripts/mkideimage.sh', 'scripts/ide-image.Dockerfile', 'scripts/gantry-podman', 'scripts/mkrootfs-gvisor.sh', 'guest/crunshim/**', '.github/workflows/ci.yml') }}
      - uses: docker/setup-qemu-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true'
      - name: install EROFS tools
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y erofs-utils
      - name: build guest rootfs
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          ./scripts/mkrootfs.sh \
            "${{ matrix.kernel_arch }}" "$RUNNER_TEMP/bundle/nerdbox-rootfs.erofs"
      - name: build gVisor rootfs variant
        if: steps.guest-cache.outputs.cache-hit != 'true'
        # Produces bundle/nerdbox-rootfs-gvisor.erofs: /sbin/crun replaced by
        # runsc (released as nerdbox-rootfs-gvisor-<arch>.erofs, which the CLI
        # auto-downloads on first -runtime runsc start).
        run: ./scripts/mkrootfs-gvisor.sh "$RUNNER_TEMP/bundle/nerdbox-rootfs.erofs" "${{ matrix.kernel_arch }}"
      - name: build test image
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/mkimage.sh alpine:3.22 "$RUNNER_TEMP/bundle/alpine.erofs" "linux/${{ matrix.docker_arch }}"
      - name: build curated SSH and Dev Containers image
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/mkideimage.sh "$RUNNER_TEMP/bundle/ide.erofs" "linux/${{ matrix.docker_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-assets-${{ matrix.name }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

  # Gantry's own hardened guest kernels (scripts/mkkernel.sh). These are
  # what the CLI downloads from the release page on first start, and what
  # the native smoke test boots. arm64 builds both the 16K default and the
  # 4K runsc twin; both arm64 variants include the early RNDR capability
  # cache, while x86_64 is 4K-only.
  #
  # The kernel version is PINNED (VERSION in scripts/mkkernel.sh, with a
  # pinned tarball sha256) — CI never floats to "latest". A bump updates
  # the script, versioned patches, and regenerated config baselines; this job
  # derives the version for its paths/keys and builds that exact set.
  #
  # Caching: ccache only. The build tree is too big for the 2 GB
  # cache-entry limit on arm64 (two configs in one tree), a job that
  # overruns its timeout never reaches the post-job cache save at all,
  # and the tarball is small enough to re-download per run.
  kernels:
    name: kernel/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: ubuntu-24.04-arm }
          - { arch: x86_64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: sudo apt-get update && sudo apt-get install -y flex bison bc xz-utils python3 libelf-dev libssl-dev ccache
      - name: verify pinned kernel inputs
        id: kver
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^VERSION=\([0-9.]*\).*/\1/p' scripts/mkkernel.sh)
          test -n "$version"
          for name in \
            deferred-smp \
            fuse-directory-readdirplus \
            fuse-readdir-eof \
            virtiofs-notifications
          do
            test -f "patches/linux-$version-$name.patch"
          done
          stale=$(find patches -maxdepth 1 -type f -name 'linux-*.patch' \
            ! -name "linux-$version-*.patch" -print)
          if [ -n "$stale" ]; then
            echo "stale kernel patches do not match Linux $version:" >&2
            echo "$stale" >&2
            exit 1
          fi
          echo "v=$version" >> "$GITHUB_OUTPUT"
      - name: cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ steps.kver.outputs.v }}-${{ matrix.arch }}-${{ hashFiles('config/gantry-kernel-*.config', 'patches/linux-*.patch', 'scripts/mkkernel.sh', 'scripts/kernel-boot-probe.py', 'scripts/kernel-hardening.sh') }}
          restore-keys: |
            kernel-ccache-${{ steps.kver.outputs.v }}-${{ matrix.arch }}-
            kernel-ccache-${{ matrix.arch }}-
      - name: build kernels
        shell: bash
        run: |
          set -eu
          export GANTRY_ARTIFACTS="$RUNNER_TEMP/kernels"
          export CC="ccache gcc" HOSTCC="ccache gcc"
          # One persistent tree for the whole job so the arm64 16k→4k
          # pair builds incrementally. Not cached across runs (ccache
          # carries the reuse); a fresh runner-owned dir passes the
          # script's WORK safety validation.
          export WORK="/tmp/linux-${{ steps.kver.outputs.v }}-build-${{ matrix.arch }}"
          ccache -M 1G
          ./scripts/mkkernel.sh ${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = arm64 ]; then
            PAGES=4k ./scripts/mkkernel.sh arm64
          fi
          ccache -s
          ls -lh "$RUNNER_TEMP/kernels"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-kernel-${{ matrix.arch }}
          path: ${{ runner.temp }}/kernels/
          if-no-files-found: error

  lint:
    name: lint/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # One run per supported target: build tags select different
        # files per platform, and findings differ per GOOS/GOARCH (see
        # .golangci.yaml). Cross-run from a single Linux runner.
        include:
          - { name: linux-amd64, goos: linux, goarch: amd64 }
          - { name: linux-arm64, goos: linux, goarch: arm64 }
          - { name: darwin-arm64, goos: darwin, goarch: arm64 }
          - { name: windows-amd64, goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      # The tool must build for the RUNNER (linux/amd64): with GOOS/
      # GOARCH set on the same step, go install cross-compiles it into
      # bin/<goos>_<goarch>/ (or .exe) and it cannot run. Install first
      # with a clean environment...
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      # ...then cross-LINT for the matrix target: GOOS/GOARCH apply only
      # to this step.
      - name: golangci-lint
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # setup-go puts the toolchain on PATH but not GOPATH/bin
        run: '"$(go env GOPATH)/bin/golangci-lint" run ./...'


  # Keep non-virtualized coverage symmetric: each supported host runs static
  # checks, native tests, protocol E2Es, terminal onboarding, manager API,
  # vendored portable tests, and both race-detector suites. Only VM boot is
  # isolated to native-smoke/linux because hosted Windows/macOS lack WHPX/HVF.
  test:
    name: test/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest }
          - { name: windows-amd64, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: genproto check
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            TMPDIR=$(cygpath -u "$RUNNER_TEMP")
            export TMPDIR
          fi
          scripts/genproto.sh --check

      - name: gofmt
        shell: bash
        run: |
          # Repository Go paths contain no whitespace; preserve Bash 3.2
          # compatibility on macOS instead of relying on mapfile.
          # shellcheck disable=SC2046
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: OAuth and field-runner orchestration tests
        shell: bash
        run: python3 -m unittest -v scripts.test_oauth_custody_e2e scripts.test_aws_e2e_validation
      - name: standalone OIDC E2E (local HTTPS IdP, no VM)
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/gantry-oidc.exe" ./cmd/gantry
          go run ./tests/e2e/oidc -gantry "$RUNNER_TEMP/gantry-oidc.exe"
      - name: remote onboarding TUI E2E (native terminal and HTTPS fixtures, no VM)
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/gantry-remotetui.exe" ./tests/e2e/remotetui
          "$RUNNER_TEMP/gantry-remotetui.exe" -gantry "$RUNNER_TEMP/gantry-oidc.exe"
      - name: M2 manager API and remote CLI E2E (no VM)
        shell: bash
        run: scripts/test-manager-api-e2e.sh -api-only -gantry "$RUNNER_TEMP/gantry-oidc.exe"
      - name: vendored go-fuse security tests
        shell: bash
        working-directory: third_party/go-fuse
        run: |
          packages=(./fs ./fuse)
          if [ "$RUNNER_OS" != Windows ]; then
            # vhost-user is a Unix SCM_RIGHTS/mmap transport and is not part of
            # the Windows backend. The portable go-fuse packages still run.
            packages+=(./internal/vhostuser)
          fi
          go test -count=1 "${packages[@]}"
      - name: vendored go-fuse race tests
        shell: bash
        working-directory: third_party/go-fuse
        run: |
          packages=(./fs ./fuse)
          if [ "$RUNNER_OS" != Windows ]; then
            packages+=(./internal/vhostuser)
          fi
          go test -race -count=1 "${packages[@]}"
      - name: go test -race
        run: go test -race -count=1 ./...

  # Keep the established Linux check name for branch protection; the sibling
  # matrix runs the same non-virtualized fuzz targets on the other host OSes.
  fuzz-virtqueue:
    name: fuzz/virtqueue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: fuzz virtqueue parser and MMIO transport
        shell: bash
        env:
          GOMEMLIMIT: 512MiB
        run: |
          for target in FuzzVirtqueueChain FuzzVirtqueueMMIO; do
            go test ./internal/virtio \
              -run='^$' \
              -fuzz="^${target}$" \
              -fuzztime=30s \
              -parallel=2 \
              -timeout=2m
          done
      - name: upload minimized failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtqueue-fuzz-failure
          path: internal/virtio/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 7

  fuzz-virtqueue-platforms:
    name: fuzz/virtqueue/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, os: windows-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: fuzz virtqueue parser and MMIO transport
        shell: bash
        env:
          GOMEMLIMIT: 512MiB
        run: |
          for target in FuzzVirtqueueChain FuzzVirtqueueMMIO; do
            go test ./internal/virtio \
              -run='^$' \
              -fuzz="^${target}$" \
              -fuzztime=30s \
              -parallel=2 \
              -timeout=2m
          done
      - name: upload minimized failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virtqueue-fuzz-${{ matrix.name }}-failure
          path: internal/virtio/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 7

  # GitHub's Linux runner exposes KVM, so this job goes beyond boot smoke: it
  # runs the full manager/SSH/policy-feed and public-client OAuth/MCP batteries
  # against the exact host, kernel, rootfs, image, and guest-helper artifacts.
  native-smoke:
    name: native-smoke/${{ matrix.name }}
    needs: [build, guest-assets, kernels, guest-tools]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, artifact: gantry-linux-amd64, binary: gantry-linux-amd64, guest: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/gantry-artifact
      - uses: actions/download-artifact@v4
        with:
          name: guest-assets-${{ matrix.guest }}
          path: ${{ runner.temp }}/guest-assets
      - uses: actions/download-artifact@v4
        with:
          name: gantry-kernel-x86_64
          path: ${{ runner.temp }}/kernels
      - uses: actions/download-artifact@v4
        with:
          name: gantry-guest-tools
          path: ${{ runner.temp }}/guest-tools
      - name: make binaries executable
        run: |
          chmod +x "${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
          chmod +x "${{ runner.temp }}/guest-tools/gantry-guest-x86_64"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: start and exec smoke test
        shell: bash
        run: |
          set -eu
          BIN="${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
          ASSETS="${{ runner.temp }}/guest-assets"
          export GANTRY_HOME="$RUNNER_TEMP/gantry-home"
          cleanup() {
            status=$?
            "$BIN" stop ci >/dev/null 2>&1 || true
            if [ "$status" -eq 0 ]; then
              "$BIN" delete ci >/dev/null 2>&1 || true
            else
              for log in "$GANTRY_HOME/ci/daemon.log" "$GANTRY_HOME/ci/console.log"; do
                if [ -f "$log" ]; then
                  echo "---- $log ----"
                  tail -c 8192 "$log" || true
                  echo "----"
                fi
              done
            fi
            return "$status"
          }
          trap cleanup EXIT
          # This smoke test is deliberately offline and exercises only native
          # boot+exec. Disable the default OAuth callback bridge so it neither
          # downloads a released guest helper nor tries the bulk exec-channel
          # fallback against the read-only workload root.
          "$BIN" start ci \
            -kernel "${{ runner.temp }}/kernels/gantry-kernel-x86_64" \
            -rootfs "$ASSETS/nerdbox-rootfs.erofs" \
            -image "$ASSETS/alpine.erofs" \
            -net=false -rw=false -oauth-bridge=false
          if output=$("$BIN" exec ci -- /bin/sh -c 'echo hello world' 2>&1); then
            exec_rc=0
          else
            exec_rc=$?
          fi
          printf '%s\n' "$output"
          if [ "$exec_rc" -ne 0 ]; then
            echo "gantry exec failed with status $exec_rc" >&2
            exit "$exec_rc"
          fi
          printf '%s\n' "$output" | tr -d '\r' | grep -Fqx 'hello world'
      - name: manager, policy-feed, and public-client OAuth real-VM E2E
        shell: bash
        env:
          GANTRY_ARTIFACTS: ${{ runner.temp }}/guest-tools
          GANTRY_TEST_EXE: ${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}
          GANTRY_TEST_KERNEL: ${{ runner.temp }}/kernels/gantry-kernel-x86_64
          GANTRY_TEST_ROOTFS: ${{ runner.temp }}/guest-assets/nerdbox-rootfs.erofs
          GANTRY_TEST_WORKLOAD_IMAGE: ${{ runner.temp }}/guest-assets/alpine.erofs
          GANTRY_E2E_WORK_DIR: ${{ runner.temp }}/native-e2e
        run: scripts/aws-e2e-validation.sh linux
      - name: upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e-${{ matrix.name }}-logs
          path: |
            ${{ runner.temp }}/gantry-home/
            ${{ runner.temp }}/native-e2e/
            /tmp/g-oauth-*/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "", runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, ext: "", runner: ubuntu-latest }
          - { goos: darwin, goarch: arm64, ext: "", runner: macos-14 }
          - { goos: windows, goarch: amd64, ext: ".exe", runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: build packages
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag names become shell input below; only strict semver-ish
          # release tags are allowed anywhere near the build. Anything
          # else (spaces, quotes, $(), backticks) fails the job.
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
      - name: build binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # Version stamping only ever happens for tags (the release job
          # gates on refs/tags/v), so REF_NAME is validated by the step
          # above; on branches it stamps the harmless literal "dev".
          version="dev"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            version="$REF_NAME"
          fi
          go build -trimpath -ldflags "-X github.com/ejpir/gantry/internal/guestasset.Version=${version} -X github.com/ejpir/gantry/internal/guestasset.BuildID=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/dist/gantry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/gantry
          if [[ "${GOOS}" == darwin ]]; then
            codesign --force --sign - --entitlements config/entitlements.plist \
              "$RUNNER_TEMP/dist/gantry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          fi
          go build -trimpath -o "$RUNNER_TEMP/dist/hostctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/hostctl
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # Release-tag Windows executables are Authenticode-signed on a fresh Windows
  # runner after the cross-platform build. Azure Artifact Signing keeps the
  # private key in managed hardware and GitHub OIDC avoids a stored client
  # secret. Configure AZURE_CLIENT_ID, AZURE_TENANT_ID, and
  # AZURE_SUBSCRIPTION_ID as repository secrets, plus these repository vars:
  # AZURE_ARTIFACT_SIGNING_ENDPOINT, AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME, and
  # AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME.
  windows-sign:
    name: sign/windows-amd64
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gantry-windows-amd64
          path: ${{ runner.temp }}\windows-release
      - name: authenticate to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticode-sign and timestamp Windows executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ runner.temp }}\windows-release
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Gantry
          description-url: https://github.com/ejpir/gantry
      - name: verify Authenticode signatures and timestamps
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\windows-release" -Filter *.exe)
          if ($files.Count -eq 0) {
            throw "no Windows executables found after signing"
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($file.Name) has invalid Authenticode status: $($signature.Status) $($signature.StatusMessage)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "$($file.Name) has no RFC 3161 timestamp"
            }
            Write-Host "$($file.Name): signed by $($signature.SignerCertificate.Subject)"
          }
      - uses: actions/upload-artifact@v4
        with:
          # Keep this outside the release job's broad gantry-* download; the
          # release explicitly overlays these signed files exactly once.
          name: windows-authenticode-amd64
          path: ${{ runner.temp }}\windows-release\*
          if-no-files-found: error
          retention-days: 1

  # The multicall guest helper binary (cmd/gantry-guest), built for both
  # guest architectures. Downloaded on first start by sandboxes that
  # configure host-bound secrets (docs/credential-brokering.md).
  guest-tools:
    name: guest-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
      - name: build guest helpers
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/guest-tools"
          version="dev"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]; then
            version="$REF_NAME"
          fi
          while read -r goarch suffix; do
            GOOS=linux GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "$RUNNER_TEMP/guest-tools/gantry-guest-$suffix" ./cmd/gantry-guest
          done <<'EOF'
          amd64 x86_64
          arm64 arm64
          EOF
          ls -lh "$RUNNER_TEMP/guest-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-guest-tools
          path: ${{ runner.temp }}/guest-tools/
          if-no-files-found: error

  release:
    name: release/${{ github.ref_name }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, windows-sign, kernels, guest-assets, guest-tools, lint, test, fuzz-virtqueue, fuzz-virtqueue-platforms, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # artifact attestations (Sigstore OIDC)
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gantry-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: guest-assets-*
          path: ${{ runner.temp }}/guest
      - name: download signed Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-authenticode-amd64
          path: ${{ runner.temp }}/signed-windows
      - name: replace unsigned Windows build outputs
        run: cp "${{ runner.temp }}"/signed-windows/*.exe "${{ runner.temp }}/release/"
      - name: stage guest rootfs assets
        run: |
          cp "${{ runner.temp }}/guest/guest-assets-arm64/nerdbox-rootfs.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/nerdbox-rootfs.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-x86_64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-arm64/nerdbox-rootfs-gvisor.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-gvisor-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/nerdbox-rootfs-gvisor.erofs" \
            "${{ runner.temp }}/release/nerdbox-rootfs-gvisor-x86_64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-arm64/alpine.erofs" \
            "${{ runner.temp }}/release/gantry-default-image-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/alpine.erofs" \
            "${{ runner.temp }}/release/gantry-default-image-x86_64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-arm64/ide.erofs" \
            "${{ runner.temp }}/release/gantry-ide-image-arm64.erofs"
          cp "${{ runner.temp }}/guest/guest-assets-amd64/ide.erofs" \
            "${{ runner.temp }}/release/gantry-ide-image-x86_64.erofs"
      # Signing changes PE bytes. Generate every checksum only after the signed
      # Windows executables have replaced the unsigned build outputs.
      - name: checksum final release artifacts
        run: |
          cd "${{ runner.temp }}/release"
          for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
      - name: attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Strict tag check again: the tag is shell input below.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9._-]+)?$ ]]
          # No --clobber: assets are immutable once published. A name
          # collision fails the job loudly instead of silently replacing
          # artifacts (and their checksums) that users may already hold.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release/* --repo "$REPO"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release/* \
              --repo "$REPO" --title "$TAG" --generate-notes
          fi
          ls -lh "$RUNNER_TEMP"/release
