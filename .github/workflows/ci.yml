name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Linux guest pieces used by the native exec smoke tests. The
  # host binaries are this repository's artifacts; the guest kernel/rootfs
  # are the compatible nerdbox assets that Gantry boots.
  guest-assets:
    name: guest-assets/${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, docker_arch: amd64, kernel_arch: x86_64, page_size: 4k }
          - { name: arm64, docker_arch: arm64, kernel_arch: arm64, page_size: 16k }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: install EROFS tools
        run: sudo apt-get update && sudo apt-get install -y erofs-utils
      - name: fetch guest source
        run: git clone --depth 1 --branch v0.2.1 https://github.com/containerd/nerdbox.git "$RUNNER_TEMP/nerdbox"
      - name: build guest kernel
        run: |
          mkdir -p "$RUNNER_TEMP/guest/kernel" "$RUNNER_TEMP/guest/rootfs" bundle
          docker buildx build --progress=plain \
            --file "$RUNNER_TEMP/nerdbox/Dockerfile" \
            --platform "linux/${{ matrix.docker_arch }}" \
            --target kernel \
            --build-arg KERNEL_ARCH=${{ matrix.kernel_arch }} \
            --build-arg KERNEL_PAGE_SIZE=${{ matrix.page_size }} \
            --build-arg KERNEL_NPROC=2 \
            --output "type=local,dest=$RUNNER_TEMP/guest/kernel" \
            "$RUNNER_TEMP/nerdbox"
          cp "$RUNNER_TEMP/guest/kernel/nerdbox-kernel-${{ matrix.kernel_arch }}" \
            bundle/nerdbox-kernel
      - name: build guest rootfs
        run: |
          docker buildx build --progress=plain \
            --file "$RUNNER_TEMP/nerdbox/Dockerfile" \
            --platform "linux/${{ matrix.docker_arch }}" \
            --target erofs \
            --build-arg KERNEL_ARCH=${{ matrix.kernel_arch }} \
            --build-arg KERNEL_PAGE_SIZE=${{ matrix.page_size }} \
            --build-arg KERNEL_NPROC=2 \
            --output "type=local,dest=$RUNNER_TEMP/guest/rootfs" \
            "$RUNNER_TEMP/nerdbox"
          cp "$RUNNER_TEMP/guest/rootfs/nerdbox-rootfs.erofs" \
            bundle/nerdbox-rootfs.erofs
      - name: build test image
        run: ./scripts/mkimage.sh alpine:3.22 "$PWD/bundle/alpine.erofs" "linux/${{ matrix.docker_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-assets-${{ matrix.name }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  test:
    name: test/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, quality: true, race: true }
          - { name: windows-arm64, os: windows-11-arm, quality: false, race: false }
          - { name: macos, os: macos-latest, quality: false, race: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: gofmt
        if: matrix.quality
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v third_party))
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        if: matrix.quality
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go test -race
        if: matrix.race
        run: go test -race -count=1 ./...

  native-smoke:
    name: native-smoke/${{ matrix.name }}
    needs: [build, guest-assets]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, artifact: gantry-linux-amd64, binary: gantry-linux-amd64, guest: amd64 }
          - { name: windows-arm64, os: windows-11-arm, artifact: gantry-windows-arm64, binary: gantry-windows-arm64.exe, guest: amd64 }
          - { name: macos, os: macos-latest, artifact: gantry-darwin-arm64, binary: gantry-darwin-arm64, guest: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/gantry-artifact
      - uses: actions/download-artifact@v4
        with:
          name: guest-assets-${{ matrix.guest }}
          path: ${{ runner.temp }}/guest-assets
      - name: make Unix binary executable
        if: runner.os != 'Windows'
        run: chmod +x "${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
      - name: sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --sign - --entitlements config/entitlements.plist -f "${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
      - name: start and exec smoke test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          BIN="${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
          ASSETS="${{ runner.temp }}/guest-assets"
          export GANTRY_HOME="$RUNNER_TEMP/gantry-home"
          cleanup() {
            "$BIN" stop ci >/dev/null 2>&1 || true
            "$BIN" delete ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$BIN" start ci \
            -kernel "$ASSETS/nerdbox-kernel" \
            -rootfs "$ASSETS/nerdbox-rootfs.erofs" \
            -image "$ASSETS/alpine.erofs" \
            -net=false -rw=false
          output=$("$BIN" exec ci -- /bin/sh -c 'echo hello world')
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fqx 'hello world'
      - name: start and exec smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP "gantry-artifact/${{ matrix.binary }}"
          $assets = Join-Path $env:RUNNER_TEMP 'guest-assets'
          $env:GANTRY_HOME = Join-Path $env:RUNNER_TEMP 'gantry-home'
          $started = $false
          try {
            & $bin start ci `
              -kernel (Join-Path $assets 'nerdbox-kernel') `
              -rootfs (Join-Path $assets 'nerdbox-rootfs.erofs') `
              -image (Join-Path $assets 'alpine.erofs') `
              -net=false -rw=false
            if ($LASTEXITCODE -ne 0) { throw "gantry start failed: $LASTEXITCODE" }
            $started = $true
            $output = & $bin exec ci -- /bin/sh -c 'echo hello world'
            $output | ForEach-Object { $_ }
            if (-not ($output -contains 'hello world')) { throw 'guest output did not contain hello world' }
          } finally {
            if ($started) { & $bin stop ci 2>$null | Out-Null }
            & $bin delete ci 2>$null | Out-Null
          }

  build:
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: build packages
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: build binaries
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/gantry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/gantry
          go build -trimpath -o "dist/hostctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/hostctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
