name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build the Linux guest pieces used by the native exec smoke tests. The
  # host binaries are this repository's artifacts; the guest kernel/rootfs
  # are the compatible nerdbox assets that Gantry boots.
  guest-assets:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: guest-assets/${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, docker_arch: amd64, kernel_arch: x86_64, page_size: 4k }
          - { name: arm64, docker_arch: arm64, kernel_arch: arm64, page_size: 16k }
    steps:
      - uses: actions/checkout@v4
      - name: cache guest assets
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bundle
          key: guest-assets-v0.2.1-${{ matrix.name }}-${{ hashFiles('scripts/mkimage.sh', '.github/workflows/ci.yml') }}
      - uses: docker/setup-buildx-action@v3
        if: steps.guest-cache.outputs.cache-hit != 'true'
      - name: install EROFS tools
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y erofs-utils
      - name: fetch guest source
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v0.2.1 https://github.com/containerd/nerdbox.git "$RUNNER_TEMP/nerdbox"
      - name: build guest kernel
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/guest/kernel" "$RUNNER_TEMP/guest/rootfs" "$RUNNER_TEMP/bundle"
          docker buildx build --progress=plain \
            --file "$RUNNER_TEMP/nerdbox/Dockerfile" \
            --platform "linux/${{ matrix.docker_arch }}" \
            --target kernel \
            --build-arg KERNEL_ARCH=${{ matrix.kernel_arch }} \
            --build-arg KERNEL_PAGE_SIZE=${{ matrix.page_size }} \
            --build-arg KERNEL_NPROC=2 \
            --output "type=local,dest=$RUNNER_TEMP/guest/kernel" \
            "$RUNNER_TEMP/nerdbox"
          cp "$RUNNER_TEMP/guest/kernel/nerdbox-kernel-${{ matrix.kernel_arch }}" \
            "$RUNNER_TEMP/bundle/nerdbox-kernel"
      - name: build guest rootfs
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          docker buildx build --progress=plain \
            --file "$RUNNER_TEMP/nerdbox/Dockerfile" \
            --platform "linux/${{ matrix.docker_arch }}" \
            --target erofs \
            --build-arg KERNEL_ARCH=${{ matrix.kernel_arch }} \
            --build-arg KERNEL_PAGE_SIZE=${{ matrix.page_size }} \
            --build-arg KERNEL_NPROC=2 \
            --output "type=local,dest=$RUNNER_TEMP/guest/rootfs" \
            "$RUNNER_TEMP/nerdbox"
          cp "$RUNNER_TEMP/guest/rootfs/nerdbox-rootfs.erofs" \
            "$RUNNER_TEMP/bundle/nerdbox-rootfs.erofs"
      - name: build test image
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: ./scripts/mkimage.sh alpine:3.22 "$RUNNER_TEMP/bundle/alpine.erofs" "linux/${{ matrix.docker_arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: guest-assets-${{ matrix.name }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 1

  test:
    name: test/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, quality: true, race: true }
          - { name: windows-arm64, os: windows-11-arm, quality: false, race: false }
          - { name: macos, os: macos-latest, quality: false, race: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: gofmt
        if: matrix.quality
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v third_party))
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        if: matrix.quality
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go test -race
        if: matrix.race
        run: go test -race -count=1 ./...

  native-smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: native-smoke/${{ matrix.name }}
    needs: [build, guest-assets]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, artifact: gantry-linux-amd64, binary: gantry-linux-amd64, guest: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/gantry-artifact
      - uses: actions/download-artifact@v4
        with:
          name: guest-assets-${{ matrix.guest }}
          path: ${{ runner.temp }}/guest-assets
      - name: make binary executable
        run: chmod +x "${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: start and exec smoke test
        shell: bash
        run: |
          set -eu
          BIN="${{ runner.temp }}/gantry-artifact/${{ matrix.binary }}"
          ASSETS="${{ runner.temp }}/guest-assets"
          export GANTRY_HOME="$RUNNER_TEMP/gantry-home"
          cleanup() {
            status=$?
            "$BIN" stop ci >/dev/null 2>&1 || true
            if [ "$status" -eq 0 ]; then
              "$BIN" delete ci >/dev/null 2>&1 || true
            else
              for log in "$GANTRY_HOME/ci/daemon.log" "$GANTRY_HOME/ci/console.log"; do
                if [ -f "$log" ]; then
                  echo "---- $log ----"
                  tail -c 8192 "$log" || true
                  echo "----"
                fi
              done
            fi
            return "$status"
          }
          trap cleanup EXIT
          "$BIN" start ci \
            -kernel "$ASSETS/nerdbox-kernel" \
            -rootfs "$ASSETS/nerdbox-rootfs.erofs" \
            -image "$ASSETS/alpine.erofs" \
            -net=false -rw=false
          if output=$("$BIN" exec ci -- /bin/sh -c 'echo hello world' 2>&1); then
            exec_rc=0
          else
            exec_rc=$?
          fi
          printf '%s\n' "$output"
          if [ "$exec_rc" -ne 0 ]; then
            echo "gantry exec failed with status $exec_rc" >&2
            exit "$exec_rc"
          fi
          printf '%s\n' "$output" | tr -d '\r' | grep -Fqx 'hello world'
      - name: upload VM logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.name }}-logs
          path: ${{ runner.temp }}/gantry-home/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: build/${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: build packages
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: build binaries
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          go build -trimpath -o "$RUNNER_TEMP/dist/gantry-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/gantry
          go build -trimpath -o "$RUNNER_TEMP/dist/hostctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/hostctl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  release:
    name: release/${{ github.ref_name }}
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gantry-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: publish release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release/* \
              --title "$TAG" --generate-notes
          fi
          ls -lh "$RUNNER_TEMP"/release
