name: govulncheck

# Vulnerability scanning lives in its own workflow (not ci.yml) so the
# weekly schedule below does not also trigger the expensive guest-assets
# and kernel builds: new Go vulnerability advisories land against
# unchanged code, so scanning must run even when nothing pushes.
on:
  push:
    branches: [main, master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/govulncheck.yml'
  schedule:
    - cron: '42 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck/${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        # One run per target OS family: build tags select different
        # files (and different stdlib/dependency call sites) per
        # platform, so reachability differs per GOOS. linux/amd64 also
        # covers the amd64-only KVM path.
        include:
          - { name: linux-amd64, goos: linux, goarch: amd64 }
          - { name: darwin-arm64, goos: darwin, goarch: arm64 }
          - { name: windows-arm64, goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      # Install with a CLEAN environment (see ci.yml lint job): GOOS/
      # GOARCH on the same step would cross-compile the tool for the
      # scan target into bin/<goos>_<goarch>/ instead of a runnable
      # runner binary.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # setup-go puts the toolchain on PATH but not GOPATH/bin
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'
